##############################################
#                                            #
#           Superfile Configuration          #
#                                            #
##############################################

# This contains the hotkey config file for superfile! More details can be found at
# https://superfile.dev/configure/custom-hotkeys/.

###############################################################################
#                                Global hotkeys                               #
###############################################################################

# Note: These hotkeys should be unique.

#-- Basic Actions
confirm = ['right', 'enter']
cd_quit = ['Q', '']
quit = ['q', 'esc']

#-- Navigation
list_down = ['down', '']
list_up = ['up', '']
page_down = ['pgdown','']
page_up = ['pgup','']

#-- File Panel Controls
close_file_panel = ['ctrl+w', '']
create_new_file_panel = ['t', '']
next_file_panel = ['tab', ']']
open_sort_options_menu = [',', 'o']
pinned_directory = ['P', '']
previous_file_panel = ['shift+tab', '[']
split_file_panel = ['N', '']
toggle_file_preview_panel = ['f', '']
toggle_reverse_sort = ['R', '']

#-- Focus Manipulation
focus_on_metadata = ['m', '']
focus_on_process_bar = ['w', '']
focus_on_sidebar = ['s', '']

#-- File/Dir Creation/Renaming
file_panel_item_create = ['a', 'ctrl+n']
file_panel_item_rename = ['r', 'ctrl+r']

#-- Main File Operations
copy_items = ['y', 'ctrl+c']
cut_items = ['x', 'ctrl+x']
delete_items = ['d', 'delete']
paste_items = ['p', 'ctrl+v']
permanently_delete_items = ['D', '']

#-- Archive Manipulation
compress_file = ['Z', '']
extract_file = ['X', '']

#-- Editor Actions
open_current_directory_with_editor = ['E', '']
open_file_with_editor = ['e', '']

#-- Other Actions
change_panel_mode = ['v', '']
copy_path = ['c', 'ctrl+p']
copy_present_working_directory = ['C', '']
open_command_line = [':', '']
open_help_menu = ['?', 'f1']
open_spf_prompt = ['>', '']
open_zoxide = ['z', '']
toggle_dot_file = ['.', '']
toggle_footer = ['F', '']

###############################################################################
#                                Typing hotkeys                               #
###############################################################################

# Note: These hotkeys can override all hotkeys.

confirm_typing = ['enter', '']
cancel_typing = ['ctrl+c', 'esc']

###############################################################################
#                            Mode-Specific Hotkeys                            #
###############################################################################

# Note: These hotkeys can conflict with other modes, but not with global
# hotkeys.

#-- Normal Mode Actions
parent_directory = ['left', 'backspace']
search_bar = ['/', '']

#-- Selection Mode Actions
file_panel_select_mode_items_select_down = ['shift+down', '']
file_panel_select_mode_items_select_up = ['shift+up', '']
file_panel_select_all_items = ['ctrl+a', 'A']
