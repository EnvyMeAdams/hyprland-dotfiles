# kitty. Linked to ~/.config/kitty/kitty.conf (see README).
# Reload: Ctrl+Shift+F5 (the wallpaper script does it for you)

# Colours follow the wallpaper: scripts/wallpaper-colors writes
# ~/.config/kitty/themes/wallpaper.conf and reloads every kitty window.
# full path: kitty.conf is a link into this repo, so a relative path
# would be looked up here instead of in ~/.config/kitty
include ~/.config/kitty/themes/wallpaper.conf

font_family JetBrains Mono
font_size 12

# see-through, with Hyprland's blur behind it
background_opacity 0.5
hide_window_decorations yes
window_padding_width 10 12

cursor_shape beam

# typing animation: the cursor leaves a short fading trail when it moves
# (uses the cursor colour, so it follows the wallpaper too)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
confirm_os_window_close 0
copy_on_select clipboard
enable_audio_bell no
